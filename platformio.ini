[platformio]
default_envs = release

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 576000
build_flags =
  -DSERIAL_BAUDRATE=115200
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/LoRaMesher/LoRaMesher#v1.0.0
    miguelbalboa/MFRC522@^1.4.12
    maxint-rd/TM16xx LEDs and Buttons@^0.7.2512
extra_scripts = pre:extra_script.py

[env:release]
build_unflags =
  -Os
  -g
  -ggdb
  -gdwarf-4
build_flags =
  ${env.build_flags}
  -O2
  -g0
  -Wl,--strip-debug

[env:debug]
build_type = debug
build_unflags =
  -DCORE_DEBUG_LEVEL=0
build_flags =
  ${env.build_flags}
  -DCORE_DEBUG_LEVEL=4
  -O2
